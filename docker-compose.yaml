
services:
  app:
    build:
      context: .
      # Use the builder stage for local development
      target: builder

    ports:
      - "8000:8000"

    # Read environment variables from .env
    env_file:
      - .env

    # Watch for file changes and restart the application
    develop:
      watch:
        - action: sync+restart
          path: .
          target: /app
          ignore:
            - __pycache__/
            - .venv/
            - .git/
